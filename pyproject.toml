[project]
name = "privacy-request-portal"
version = "0.1.0"
description = "Reference data subject request portal: risk-based verification, statutory deadlines, deletion fan-out, hash-chained audit log, consent gate."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Deokhwa Jeong" }]
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "pydantic[email]>=2.7",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "E501",  # line length is left to ruff format
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "B904",  # HTTPException raised from handlers
    "S101",  # asserts used for invariants
    "S608",  # DDL strings are constants
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"demo/*" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore:.*httpx.*"]
